# Harborline AP, everything in one command:   docker compose up -d   →   http://localhost:3000
#
#   db     Postgres 16. Two roles: `postgres` (owner — migrations + seed, DATABASE_URL_ADMIN) and
#          `ap_app` (the app, DATABASE_URL), which cannot change or backdate audit history
#          (migration 0001_audit_guards.sql).
#   setup  one-shot: migrations, then the dataset seed ONLY on an empty database (scripts/docker-setup.ts).
#          Exits when done; the app waits for it. Data survives restarts.
#   app    Next.js: pages (frontend) + src/server (backend), as ap_app. Secrets (Anthropic, Gmail)
#          come from .env.local if it exists.
#   gmail-poller  polls the Gmail inbox every GMAIL_POLL_SECONDS (default 10) and saves bills
#          through the pipeline as ap_app. Needs the GMAIL_* keys in .env.local (one-time
#          `npm run gmail:auth` on the host — it opens a browser). Without them it exits quietly.
#          The first poll records "now"; only mail arriving after that is read. Logs:
#          docker compose logs -f gmail-poller
#
# Only the database (for `npm run dev` on your machine): npm run db:up
# Rebuild after code changes:                           docker compose up -d --build
# Start over with a fresh database:                    docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harborline
      AP_APP_PASSWORD: ap_app_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harborline"]
      interval: 2s
      timeout: 3s
      retries: 20

  setup:
    build: .
    image: harborline-ap
    command: ["npx", "tsx", "scripts/docker-setup.ts"]
    environment:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@db:5432/harborline
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: harborline-ap
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://ap_app:ap_app_local@db:5432/harborline
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

  gmail-poller:
    image: harborline-ap
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://ap_app:ap_app_local@db:5432/harborline
      GMAIL_POLL_SECONDS: ${GMAIL_POLL_SECONDS:-10}
    # No Gmail credentials → say so and exit 0 (stays stopped); the rest of the demo still runs.
    command:
      - sh
      - -c
      - |
        if [ -z "$$GMAIL_REFRESH_TOKEN" ] || [ -z "$$GMAIL_CLIENT_ID" ]; then
          echo "Gmail not configured (.env.local: GMAIL_CLIENT_ID/SECRET/REFRESH_TOKEN; run npm run gmail:auth on the host). Poller not started."
          exit 0
        fi
        exec npx tsx scripts/gmail-poll.ts --watch "$$GMAIL_POLL_SECONDS"
    volumes:
      - intake-state:/app/.intake   # the Gmail cursor, so a restart does not re-read old mail
    restart: on-failure

volumes:
  pgdata:
  intake-state:
