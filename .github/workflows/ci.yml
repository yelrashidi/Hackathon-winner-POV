name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and import resolution
        run: npm run typecheck
      - name: Smoke test runtime imports
        run: npm run check:imports
      - name: Check shared contracts
        run: npm run test:contracts
      - name: Run all unit and fixture tests
        run: npm test
      - name: Validate incoming batch expectations
        run: npm run validate:batch
      - name: Replay historical invoices
        run: npm run validate:history
